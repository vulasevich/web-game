<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TestTest</title>
  <style>
    body {
      background-color: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
    }

    h1 {
      margin-bottom: 40px;
      font-size: 2rem;
    }

    .shapes {
      display: flex;
      gap: 40px;
      align-items: center;
    }

    .circle {
      width: 100px;
      height: 100px;
      background-color: #0000ff;
      border-radius: 50%;
    }

    .square {
      width: 100px;
      height: 100px;
      background-color: #ff0000;
      border: 4px solid #830000;
    }

    .triangle {
      width: 0;
      height: 0;
      border-left: 55px solid transparent;
      border-right: 55px solid transparent;
      border-bottom: 100px solid #00ff00;
    }
  </style>
</head>
<body>
  <h1>Test123</h1>
  <div class="shapes">
    <div class="circle"></div>
    <div class="square"></div>
    <div class="triangle"></div>
  </div>
</body>
</html>
