<!DOCTYPE html>
<html lang="ru">
<head>
<style>
.center {
  margin: auto;
  width: 50%;
  border: 3px solid #73AD21;
  padding: 10px;
}
</style>
</head>
<body>

  <div class="center">
    <img id="changeIt" src="https://raw.githubusercontent.com/vulasevich/web-game/refs/heads/main/Fish/spin.gif" width="640" height="360"/>
    
    <button onclick="changeFish(1)" width="300" height="120">
      <p>🐟🐟🐟</p>
    </button>
    
    <button onclick="changeFish(2)" width="300" height="120">
      <p>🐠🐠🐠</p>
    </button>
  </div>
  
  <script>
    function changeFish(type){
      if (type == 1) {
      document.getElementById("changeIt").src= "https://raw.githubusercontent.com/vulasevich/web-game/refs/heads/main/Fish/scream.gif";
      }
      if (type == 2) {
      document.getElementById("changeIt").src= "https://raw.githubusercontent.com/vulasevich/web-game/refs/heads/main/Fish/kiss.gif";
      }
    }
  </script>
  
</body>
</html>
